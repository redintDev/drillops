name: "DrillOps Restore Verification Action"
description: "Executes automated database restore drills and generates SOC2/ISO 27001 compliance certificates."
author: "DrillOps"
branding:
  icon: "shield"
  color: "green"

inputs:
  backup-path:
    description: "Path to database backup file (.dump, .sql, .sql.gz, .sqlite)"
    required: true
  database-type:
    description: "Database engine ('sqlite', 'postgres', 'mysql', or 'mariadb')"
    required: false
    default: "sqlite"
  engine-type:
    description: "Alias for database-type ('sqlite', 'postgres', 'mysql', or 'mariadb')"
    required: false
    default: ""
  expected-tables:
    description: "Comma-separated list of critical tables that must exist and contain data"
    required: false
    default: ""
  required-tables:
    description: "Alias for expected-tables (comma-separated list of critical tables)"
    required: false
    default: ""
  scan-pii:
    description: "Scan restored tables for unmasked customer PII/secrets (SOC2 CC6.1)"
    required: false
    default: "false"
  max-rpo-hours:
    description: "Maximum allowable Recovery Point Objective (RPO) backup age in hours"
    required: false
    default: ""
  require-321:
    description: "Enforce strict 3-2-1 backup redundancy rule (3 copies, 2 media types, 1 offsite)"
    required: false
    default: "false"
  publish-summary:
    description: "Publish markdown certificate directly to GitHub Step Summary"
    required: false
    default: "true"
  license-key:
    description: "DrillOps Pro or Enterprise offline license token for commercial features"
    required: false
    default: ""
  output-dir:
    description: "Directory where JSON and Markdown certificates will be saved"
    required: false
    default: "./certificates"
  webhook-url:
    description: "Optional generic webhook URL for incident alerting"
    required: false
    default: ""
  slack-webhook:
    description: "Optional Slack incoming webhook URL"
    required: false
    default: ""

outputs:
  certificate-id:
    description: "Generated SOC2 Certificate ID"
    value: ${{ steps.run-drill.outputs.certificate_id }}
  restore-status:
    description: "Overall restore drill status (PASSED or FAILED)"
    value: ${{ steps.run-drill.outputs.restore_status }}
  restore-rto-seconds:
    description: "Measured Recovery Time Objective (RTO) in seconds"
    value: ${{ steps.run-drill.outputs.restore_rto_seconds }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install DrillOps
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Execute Restore Drill
      id: run-drill
      shell: bash
      run: |
        if [ -n "${{ inputs.license-key }}" ]; then
          export DRILLOPS_LICENSE_KEY="${{ inputs.license-key }}"
        fi

        DB_TYPE="${{ inputs.database-type }}"
        if [ -n "${{ inputs.engine-type }}" ]; then
          DB_TYPE="${{ inputs.engine-type }}"
        fi

        TABLES="${{ inputs.expected-tables }}"
        if [ -n "${{ inputs.required-tables }}" ]; then
          TABLES="${{ inputs.required-tables }}"
        fi

        CMD="drillops verify --backup \"${{ inputs.backup-path }}\" --type \"$DB_TYPE\" --out \"${{ inputs.output-dir }}\""
        if [ -n "$TABLES" ]; then
          CMD="$CMD --tables \"$TABLES\""
        fi
        if [ "${{ inputs.scan-pii }}" = "true" ]; then
          CMD="$CMD --scan-pii"
        fi
        if [ -n "${{ inputs.max-rpo-hours }}" ]; then
          CMD="$CMD --max-rpo-hours \"${{ inputs.max-rpo-hours }}\""
        fi
        if [ "${{ inputs.require-321 }}" = "true" ]; then
          CMD="$CMD --require-321"
        fi
        if [ -n "${{ inputs.webhook-url }}" ]; then
          CMD="$CMD --notify-webhook \"${{ inputs.webhook-url }}\""
        fi
        if [ -n "${{ inputs.slack-webhook }}" ]; then
          CMD="$CMD --notify-slack \"${{ inputs.slack-webhook }}\""
        fi

        eval $CMD

        CERT_FILE=$(ls -t ${{ inputs.output-dir }}/drill_cert_*.json 2>/dev/null | head -n 1)
        if [ -f "$CERT_FILE" ]; then
          CERT_ID=$(python -c "import json; print(json.load(open('$CERT_FILE'))['certificate_id'])")
          STATUS=$(python -c "import json; print(json.load(open('$CERT_FILE'))['overall_status'])")
          RTO=$(python -c "import json; print(json.load(open('$CERT_FILE'))['metrics']['recovery_time_objective_actual_seconds'])")
          echo "certificate_id=$CERT_ID" >> $GITHUB_OUTPUT
          echo "restore_status=$STATUS" >> $GITHUB_OUTPUT
          echo "restore_rto_seconds=$RTO" >> $GITHUB_OUTPUT
        fi

        CERT_MD=$(ls -t ${{ inputs.output-dir }}/drill_cert_*.md 2>/dev/null | head -n 1)
        if [ "${{ inputs.publish-summary }}" = "true" ] && [ -f "$CERT_MD" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat "$CERT_MD" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload Compliance Certificate Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: drillops-certificates
        path: ${{ inputs.output-dir }}
