# DrillOps Scheduled Disaster Recovery Verification Pipeline (GitLab CI)
# Copy into your repository as .gitlab-ci.yml or include into your existing pipeline

stages:
  - disaster-recovery

verify_database_dr:
  stage: disaster-recovery
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client curl ca-certificates
    - pip install --no-cache-dir "git+https://github.com/redintDev/drillops.git"
    - drillops doctor
  script:
    - mkdir -p ./certificates
    - drillops verify
        --backup "${BACKUP_S3_URI}"
        --type postgres
        --tables users,organizations,billing_subscriptions
        --max-rto-seconds 300
        --scan-pii
        --out ./certificates
    - drillops checklist --cert-dir ./certificates --company "${COMPANY_NAME:-Organization}"
    - drillops audit-pack --cert-dir ./certificates --out-zip ./certificates/soc2_gitlab_dossier.zip --days 90 --company "${COMPANY_NAME:-Organization}"
  variables:
    AWS_ACCESS_KEY_ID: $BACKUP_VAULT_KEY_ID
    AWS_SECRET_ACCESS_KEY: $BACKUP_VAULT_SECRET
    AWS_DEFAULT_REGION: "us-east-1"
  artifacts:
    name: "soc2-dr-evidence-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 365 days
    paths:
      - certificates/
