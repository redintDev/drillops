name: "Monthly SOC 2 Disaster Recovery Audit Dossier (CC9.1)"

on:
  schedule:
    # 1st of every month at midnight UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:
    # Allow manual execution for ad-hoc auditor requests

jobs:
  monthly-audit-pack:
    name: "Compile 90-Day SOC 2 Audit Dossier"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Database Clients & DrillOps"
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install "git+https://github.com/redintDev/drillops.git"

      - name: "Execute Latest Ephemeral DR Restore Drill"
        uses: redintDev/drillops@v0.2
        with:
          backup-path: "./backups/production_latest.sql.gz"
          database-type: "postgres"
          expected-tables: "users,organizations,billing_subscriptions"
          output-dir: "./certificates"
          scan-pii: "true"

      - name: "Compile 90-Day Auditor Evidence Pack"
        run: |
          drillops audit-pack \
            --cert-dir ./certificates \
            --out-zip ./soc2_audit_dossier.zip \
            --days 90 \
            --company "${{ vars.COMPANY_NAME || 'Organization' }}"

      - name: "Upload 90-Day Audit Dossier for Compliance Review"
        uses: actions/upload-artifact@v4
        with:
          name: "soc2-dr-audit-dossier"
          path: "./soc2_audit_dossier.zip"
          retention-days: 365
