# SafeMigrate GitLab CI/CD Pipeline Example
# Drop into your repository root as .gitlab-ci.yml
# Statically audits database DDL migrations for lock queuing hazards and table rewrites.
# Documentation: https://redintdev.github.io/drillops/safemigrate/

stages:
  - lint

safemigrate-lint:
  stage: lint
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    MIGRATIONS_DIR: "migrations"
    DIALECT: "postgresql"  # Set to "postgresql" or "mysql"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --upgrade pip
    - pip install "git+https://github.com/redintDev/drillops.git#subdirectory=safemigrate"
  script:
    - safemigrate --version
    - safemigrate rules --dialect "$DIALECT"
    - safemigrate check "$MIGRATIONS_DIR" --dialect "$DIALECT"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "migrations/**/*"
        - "db/migrations/**/*"
        - "sql/**/*"
        - "**/*.sql"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
