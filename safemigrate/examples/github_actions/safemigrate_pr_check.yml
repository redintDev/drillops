# SafeMigrate GitHub Actions PR Workflow Example
# Drop into your repository as .github/workflows/safemigrate.yml
# Statically audits database DDL migrations for lock queuing hazards and table rewrites.
# Documentation: https://redintdev.github.io/drillops/safemigrate/

name: "SafeMigrate PR Check"

on:
  pull_request:
    paths:
      - "migrations/**"
      - "db/migrations/**"
      - "sql/**"
      - "**/*.sql"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-migrations:
    name: "Audit Database Migrations for Locks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SafeMigrate Action
        uses: redintDev/drillops/safemigrate@main
        with:
          path: "migrations"
          dialect: "postgresql"     # or "mysql"
          strict: "false"           # set "true" to fail on warnings (e.g. lock_timeout missing)
          publish-summary: "true"   # publishes rich markdown report to GitHub Step Summary
          suggest-fixes: "true"     # generates unified diff with zero-downtime rewrites
