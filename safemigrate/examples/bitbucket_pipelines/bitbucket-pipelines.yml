# SafeMigrate Bitbucket Pipelines Configuration Example
# Drop into your repository root as bitbucket-pipelines.yml
# Statically audits database DDL migrations for lock queuing hazards and table rewrites.
# Documentation: https://redintdev.github.io/drillops/safemigrate/

image: python:3.12-slim

definitions:
  caches:
    pip: ~/.cache/pip
  steps:
    - step: &safemigrate-lint
        name: SafeMigrate Migration Lock Audit
        caches:
          - pip
        script:
          - apt-get update && apt-get install -y --no-install-recommends git
          - pip install --upgrade pip
          - pip install "git+https://github.com/redintDev/drillops.git#subdirectory=safemigrate"
          - safemigrate --version
          - safemigrate rules --dialect "${DIALECT:-postgresql}"
          - safemigrate check "${MIGRATIONS_DIR:-migrations}" --dialect "${DIALECT:-postgresql}"

pipelines:
  pull-requests:
    '**':
      - step: *safemigrate-lint

  branches:
    main:
      - step: *safemigrate-lint
